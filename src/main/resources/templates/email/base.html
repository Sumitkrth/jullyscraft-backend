<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff;
            border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .header  { background: #1a1a2e; color: #fff; padding: 24px 32px; }
        .header h1 { margin: 0; font-size: 22px; }
        .body    { padding: 32px; color: #333; line-height: 1.6; }
        .btn     { display: inline-block; padding: 12px 28px; background: #7F77DD;
            color: #fff; text-decoration: none; border-radius: 6px;
            font-weight: bold; margin: 20px 0; }
        .footer  { background: #f9f9f9; padding: 16px 32px; font-size: 12px; color: #999;
            border-top: 1px solid #eee; text-align: center; }
        .order-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        .order-table th, .order-table td { padding: 10px 12px; border: 1px solid #eee; text-align: left; }
        .order-table th { background: #f5f5f5; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛍️ Jully's Craft</h1>
    </div>
    <div class="body" th:replace="~{${templateFragment}}"></div>
    <div class="footer">
        © 2024 Jully's Craft. All rights reserved.<br/>
        <small>You received this email because you have an account with us.</small>
    </div>
</div>
</body>
</html>
