<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2>Order Confirmed ✅</h2>
    <p>Hi <span th:text="${firstName}">there</span>,</p>
    <p>Your order <strong th:text="${orderNumber}">#JC-000001</strong>
        has been placed successfully!</p>
    <table class="order-table">
        <tr><th>Order Number</th><td th:text="${orderNumber}"></td></tr>
        <tr><th>Total Amount</th><td th:text="'₹' + ${totalAmount}"></td></tr>
        <tr><th>Payment Method</th><td th:text="${paymentMethod}"></td></tr>
        <tr><th>Shipping To</th><td th:text="${shippingAddress}"></td></tr>
    </table>
    <a th:href="${orderUrl}" class="btn">Track Your Order</a>
</div>
</body>
</html>
