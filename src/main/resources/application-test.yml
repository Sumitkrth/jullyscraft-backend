spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    database-platform: org.hibernate.dialect.H2Dialect

    show-sql: false

  data:
    redis:
      host: localhost
      port: 6370

logging:
  level:
    root: WARN

app:
  jwt:
    secret: test-secret-key